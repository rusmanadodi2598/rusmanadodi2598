<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340"
     font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     role="img"
     aria-label="Go terminal listing api-gateway commands, next to a diagram where the api gateway routes down to three microservices">
  <title>API gateway in Go routing to microservices</title>

  <!-- palette from tokens.css: bg #0A0E27, panel #111631, line #1E2A4A,
       text #E2E8F0, muted #94A3B8, accent #2563EB / #60A5FA -->

  <!-- panel -->
  <rect x="1" y="1" width="898" height="338" rx="14" fill="#0A0E27" stroke="#1E2A4A" stroke-width="1.5"/>
  <line x1="16" y1="44" x2="884" y2="44" stroke="#1E2A4A" stroke-width="1"/>
  <line x1="470" y1="16" x2="470" y2="324" stroke="#1E2A4A" stroke-width="1"/>

  <!-- window chrome -->
  <circle cx="30" cy="23" r="4.5" fill="#ff5f56"/>
  <circle cx="48" cy="23" r="4.5" fill="#ffbd2e"/>
  <circle cx="66" cy="23" r="4.5" fill="#27c93f"/>
  <text x="88" y="27" fill="#94A3B8" font-size="11">bash</text>

  <!-- terminal, revealed line by line -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.07;0.93;0.98"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <text x="28" y="76" font-size="13">
      <tspan fill="#60A5FA">$ </tspan><tspan fill="#E2E8F0">go version</tspan>
    </text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.12;0.93;0.98"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <text x="28" y="106" fill="#94A3B8" font-size="13">go1.26.5 linux/amd64</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.17;0.93;0.98"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <text x="28" y="136" font-size="13">
      <tspan fill="#60A5FA">$ </tspan><tspan fill="#E2E8F0">go list ./cmd/...</tspan>
    </text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.22;0.93;0.98"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <text x="28" y="166" fill="#E2E8F0" font-size="13">api-gateway/cmd/gateway</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.27;0.93;0.98"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <text x="28" y="196" fill="#E2E8F0" font-size="13">api-gateway/cmd/worker</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.32;0.93;0.98"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <text x="28" y="226" fill="#E2E8F0" font-size="13">api-gateway/cmd/retention</text>
  </g>

  <rect x="228" y="212" width="8" height="16" fill="#60A5FA">
    <animate attributeName="opacity" values="1;0" calcMode="discrete"
             dur="1s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- diagram base: gateway and services -->
  <rect x="585" y="76" width="200" height="56" rx="10" fill="#111631" stroke="#1E2A4A" stroke-width="1.5"/>
  <text x="685" y="100" fill="#E2E8F0" font-size="15" text-anchor="middle">api gateway</text>
  <text x="685" y="120" fill="#60A5FA" font-size="12" text-anchor="middle">Go</text>

  <rect x="482" y="236" width="120" height="54" rx="10" fill="#111631" stroke="#1E2A4A" stroke-width="1.5"/>
  <text x="542" y="268" fill="#E2E8F0" font-size="12.5" text-anchor="middle">microservice</text>

  <rect x="625" y="236" width="120" height="54" rx="10" fill="#111631" stroke="#1E2A4A" stroke-width="1.5"/>
  <text x="685" y="268" fill="#E2E8F0" font-size="12.5" text-anchor="middle">microservice</text>

  <rect x="768" y="236" width="120" height="54" rx="10" fill="#111631" stroke="#1E2A4A" stroke-width="1.5"/>
  <text x="828" y="268" fill="#E2E8F0" font-size="12.5" text-anchor="middle">microservice</text>

  <!-- connectors -->
  <line x1="685" y1="132" x2="685" y2="182" stroke="#1E2A4A" stroke-width="2"/>
  <line x1="542" y1="182" x2="828" y2="182" stroke="#1E2A4A" stroke-width="2"/>
  <line x1="542" y1="182" x2="542" y2="226" stroke="#1E2A4A" stroke-width="2"/>
  <line x1="685" y1="182" x2="685" y2="226" stroke="#1E2A4A" stroke-width="2"/>
  <line x1="828" y1="182" x2="828" y2="226" stroke="#1E2A4A" stroke-width="2"/>
  <polygon points="536,226 548,226 542,236" fill="#1E2A4A"/>
  <polygon points="679,226 691,226 685,236" fill="#1E2A4A"/>
  <polygon points="822,226 834,226 828,236" fill="#1E2A4A"/>

  <!-- flow, lit in order: gateway, trunk, then one branch per service -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.33;0.92;0.96"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <rect x="585" y="76" width="200" height="56" rx="10" fill="none" stroke="#60A5FA" stroke-width="2"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.37;0.92;0.96"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <line x1="685" y1="132" x2="685" y2="182" stroke="#2563EB" stroke-width="2.5"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.45;0.92;0.96"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <path d="M685,182 L542,182 L542,226" fill="none" stroke="#2563EB" stroke-width="2.5"/>
    <polygon points="536,226 548,226 542,236" fill="#60A5FA"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.53;0.92;0.96"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <line x1="685" y1="182" x2="685" y2="226" stroke="#2563EB" stroke-width="2.5"/>
    <polygon points="679,226 691,226 685,236" fill="#60A5FA"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.61;0.92;0.96"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <path d="M685,182 L828,182 L828,226" fill="none" stroke="#2563EB" stroke-width="2.5"/>
    <polygon points="822,226 834,226 828,236" fill="#60A5FA"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.47;0.92;0.96"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <rect x="482" y="236" width="120" height="54" rx="10" fill="none" stroke="#60A5FA" stroke-width="2"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.55;0.92;0.96"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <rect x="625" y="236" width="120" height="54" rx="10" fill="none" stroke="#60A5FA" stroke-width="2"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.63;0.92;0.96"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <rect x="768" y="236" width="120" height="54" rx="10" fill="none" stroke="#60A5FA" stroke-width="2"/>
  </g>
</svg>
